<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publicar jogo — BlockWorld</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b30;--line:#293650;--text:#edf2ff;--muted:#9aa8c5;--accent:#8175ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#24245b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}
main{width:min(820px,calc(100% - 32px));margin:42px auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px}
.panel{margin-top:22px;background:#121a2cef;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 60px #0003}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:22px 0 10px}
p{color:var(--muted)}
label{display:block;font-weight:650;margin:16px 0 7px}
input,textarea,select{width:100%;background:#0b1223;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
textarea{min-height:100px;resize:vertical}
button,.button{background:var(--accent);color:white;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:disabled{opacity:.5;cursor:wait}
.mutedbtn{background:#202b43}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.status{padding:12px;border-radius:10px;background:#0b1223;color:#b9c6e2;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px}
.help{font-size:13px}
.hidden{display:none!important}
.auth-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media(max-width:600px){.row{grid-template-columns:1fr}.panel{padding:17px}}
</style>
</head>
<body>
<main>
<div class="top">
<a class="logo" href="/" style="color:inherit;text-decoration:none">◈ BlockWorld</a>
<a class="button mutedbtn" href="/">Voltar à plataforma</a>
</div>
<h1>Publique seu jogo.</h1>
<p>Entre na sua conta, configure os detalhes e publique a sua criação da BlockWorld Engine.</p>

<section class="panel">
<div id="account">Verificando sua conta...</div>

<section id="authPanel" class="hidden">
<h2 id="authTitle">Entrar na BlockWorld</h2>
<p id="authDescription">Entre para publicar seu jogo.</p>
<form id="authForm">
<label for="username">Nome de usuário</label>
<input id="username" name="username" minlength="3" maxlength="24" autocomplete="username" required>
<label for="password">Senha</label>
<input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required>
<div class="auth-actions">
<button id="authSubmit" type="submit">Entrar</button>
<button id="toggleAuth" class="mutedbtn" type="button">Criar conta</button>
</div>
</form>
</section>

<form id="publishForm" class="hidden">
<label for="title">Nome do jogo</label>
<input id="title" maxlength="60" minlength="2" required placeholder="Meu primeiro mundo">
<label for="description">Descrição</label>
<textarea id="description" maxlength="500" minlength="5" required placeholder="Conte aos jogadores o que eles vão encontrar..."></textarea>
<div class="row">
<div>
<label for="category">Categoria</label>
<select id="category">
<option>Aventura</option><option>Construção</option><option>Corrida</option><option>Obby</option><option>Simulação</option><option>Outro</option>
</select>
</div>
<div id="sceneFileContainer">
<label for="sceneFile">Arquivo de cena (.json)</label>
<input id="sceneFile" type="file" accept="application/json,.json">
</div>
</div>
<p id="sceneHelp" class="help">Você pode publicar uma cena JSON exportada pela Engine.</p>
<button id="publishButton" type="submit">Publicar jogo</button>
<button id="logoutButton" class="mutedbtn" type="button">Sair da conta</button>
</form>
<div id="status" class="status" role="status">Carregando...</div>
</section>
</main>
<script src="/publish.js" defer></script>
</body>
</html>
