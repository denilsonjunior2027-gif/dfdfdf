
<script>
const API_URL = 'https://dfdfdf-1.onrender.com';

const form = document.getElementById('authForm');
const loginTab = document.getElementById('loginTab');
const registerTab = document.getElementById('registerTab');
const confirmWrap = document.getElementById('confirmWrap');
const confirmPassword = document.getElementById('confirmPassword');
const password = document.getElementById('password');
const submitButton = document.getElementById('submitButton');
const notice = document.getElementById('notice');

let mode = 'login';

function showNotice(message, type) {
  notice.textContent = message;
  notice.className = 'notice ' + type;
}

function setMode(next) {
  mode = next;
  const registering = mode === 'register';

  loginTab.classList.toggle('active', !registering);
  registerTab.classList.toggle('active', registering);

  confirmWrap.hidden = !registering;
  confirmPassword.required = registering;

  password.autocomplete = registering
    ? 'new-password'
    : 'current-password';

  document.getElementById('heading').textContent =
    registering ? 'Crie sua conta' : 'Bem-vindo de volta!';

  document.getElementById('description').textContent = registering
    ? 'Cadastre-se para começar sua jornada na BlockWorld.'
    : 'Entre para acessar sua conta e seus jogos.';

  submitButton.textContent = registering
    ? 'Criar minha conta'
    : 'Entrar na conta';

  notice.className = 'notice';
}

loginTab.addEventListener('click', () => setMode('login'));
registerTab.addEventListener('click', () => setMode('register'));

function getDestination() {
  const next = new URLSearchParams(location.search).get('next') || '/';

  return next.startsWith('/')
    && !next.startsWith('//')
    && next !== '/login.html'
    ? next
    : '/';
}

async function apiRequest(path, options = {}) {
  const response = await fetch(API_URL + path, {
    ...options,
    credentials: 'include',
    cache: 'no-store'
  });

  const contentType = response.headers.get('content-type') || '';

  let data = {};

  if (contentType.includes('application/json')) {
    data = await response.json();
  } else {
    throw new Error(
      response.ok
        ? 'O servidor retornou uma resposta inesperada.'
        : `Erro HTTP ${response.status}. Verifique a API do Render e o CORS.`
    );
  }

  if (!response.ok) {
    throw new Error(data.error || data.message || `Erro HTTP ${response.status}.`);
  }

  return data;
}

async function checkSession() {
  try {
    const data = await apiRequest('/api/me');

    if (data.user) {
      showNotice(
        'Você já está conectado como ' +
        data.user.username +
        '. Redirecionando...',
        'success'
      );

      submitButton.disabled = true;
      location.replace(getDestination());
    }
  } catch (error) {
    console.warn('[BlockWorld] Não foi possível verificar a sessão:', error);
  }
}

form.addEventListener('submit', async event => {
  event.preventDefault();

  const username = document.getElementById('username').value.trim();
  const secret = password.value;

  if (mode === 'register' && secret !== confirmPassword.value) {
    showNotice('As senhas não coincidem.', 'error');
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = mode === 'register'
    ? 'Criando conta...'
    : 'Entrando...';

  notice.className = 'notice';

  try {
    const path = mode === 'register'
      ? '/api/register'
      : '/api/login';

    await apiRequest(path, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        username,
        password: secret
      })
    });

    showNotice('Tudo certo! Entrando na BlockWorld...', 'success');
    location.assign(getDestination());

  } catch (error) {
    showNotice(
      error.message || 'Falha de conexão com o servidor.',
      'error'
    );

    submitButton.disabled = false;
    submitButton.textContent = mode === 'register'
      ? 'Criar minha conta'
      : 'Entrar na conta';
  }
});

checkSession();
</script>
