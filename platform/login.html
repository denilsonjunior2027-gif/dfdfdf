<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #f5f3ff;
      background:
        radial-gradient(ellipse at top, #25205a 0%, transparent 55%),
        linear-gradient(135deg, #080812, #101027 60%, #15102c);
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-icon {
      display: inline-flex;

    .logo h1 {
      margin: 14px 0 5px;

    }

    .tab.active {
      color: white;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .description {
      margin: 0 0 24px;

    .field {

      display: block;

</head>

<body>
  <main class="container">
    <header class="logo">
      <div class="logo-icon" aria-hidden="true">B</div>
      <h1>Block<span>World</span></h1>
      <p>Sua próxima aventura começa aqui.</p>
    </header>

    <section class="card">
      <div class="tabs">
        <button
          type="button"
          id="loginTab"
          class="tab active"
        >Entrar</button>

        <button
          type="button"
          id="registerTab"
          class="tab"
        >Criar conta</button>
      </div>

      <h2 id="heading">Bem-vindo de volta!</h2>

      <p id="description" class="description">
        Entre para acessar sua conta e seus jogos.
      </p>

      <form id="authForm">
        <div class="field">
          <label for="username">Nome de usuário</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Digite seu nome de usuário"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            required
          >
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            minlength="8"
            maxlength="128"
            required
          >
        </div>

        <div class="field" id="confirmWrap" hidden>
          <label for="confirmPassword">Confirmar senha</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Digite a senha novamente"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
          >
        </div>

        <button class="submit" id="submitButton" type="submit">
          Entrar na conta
        </button>

        <div
          id="notice"
          class="notice"
          role="status"
          aria-live="polite"
        ></div>
      </form>
    </section>

    <div style="text-align:center">
      <a class="back" href="/">← Voltar para a BlockWorld</a>
    </div>

    <footer class="footer">
      BlockWorld · Entre e continue sua aventura.
    </footer>
  </main>

  <script>
  (() => {
    'use strict';

    const API_URL = 'https://dfdfdf-1.onrender.com';

    const $ = id => document.getElementById(id);

    const form = $('authForm');
    const loginTab = $('loginTab');
    const registerTab = $('registerTab');
    const confirmWrap = $('confirmWrap');
    const confirmPassword = $('confirmPassword');
    const password = $('password');
    const submitButton = $('submitButton');
    const notice = $('notice');
    const username = $('username');
    const heading = $('heading');
    const description = $('description');

    const requiredElements = [
      form, loginTab, registerTab, confirmWrap,
      confirmPassword, password, submitButton,
      notice, username, heading, description
    ];

    if (requiredElements.some(element => !element)) {
      console.error(
        '[BlockWorld] O formulário HTML está incompleto.'
      );
      return;
    }

    let mode = 'login';
    let sending = false;

    function showNotice(message, type = 'error') {
      notice.textContent = message;
      notice.className = 'notice ' + type;
    }

    function setMode(nextMode) {
      if (sending) return;

      mode = nextMode === 'register' ? 'register' : 'login';
      const registering = mode === 'register';

      loginTab.classList.toggle('active', !registering);
      registerTab.classList.toggle('active', registering);

      confirmWrap.hidden = !registering;
      confirmPassword.required = registering;

      password.autocomplete = registering
        ? 'new-password'
        : 'current-password';

      heading.textContent = registering
        ? 'Crie sua conta'
        : 'Bem-vindo de volta!';

      description.textContent = registering
        ? 'Cadastre-se para começar sua jornada na BlockWorld.'
        : 'Entre para acessar sua conta e seus jogos.';

      submitButton.textContent = registering
        ? 'Criar minha conta'
        : 'Entrar na conta';

      showNotice('', '');
    }

    function getDestination() {
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/';

      // Só permite caminhos locais do próprio site.
      if (
        next.startsWith('/') &&
        !next.startsWith('//') &&
        !next.startsWith('/\\') &&
        next !== '/login.html'
      ) {
        return next;
      }

      return '/';
    }

    async function apiRequest(path, options = {}) {
      let response;

      try {
        response = await fetch(API_URL + path, {
          ...options,
          credentials: 'include',
          cache: 'no-store'
        });
      } catch (error) {
        console.error('[BlockWorld] Erro de conexão:', error);
        throw new Error(
          'Não foi possível conectar ao servidor. Verifique o servidor e a configuração CORS.'
        );
      }

      const contentType = response.headers.get('content-type') || '';

      if (!contentType.includes('application/json')) {
        throw new Error(
          'O servidor retornou uma resposta inesperada (HTTP ' +
          response.status + ').'
        );
      }

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error('O servidor retornou JSON inválido.');
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          'O servidor retornou HTTP ' + response.status + '.'
        );
      }

      return data;
    }

    async function checkSession() {
      try {
        const data = await apiRequest('/api/me');

        if (data.user) {
          showNotice(
            'Você já está conectado. Redirecionando...',
            'success'
          );

          submitButton.disabled = true;

          window.setTimeout(() => {
            location.replace(getDestination());
          }, 700);
        }
      } catch (error) {
        console.warn(
          '[BlockWorld] Não foi possível verificar a sessão:',
          error.message
        );
      }
    }

    loginTab.addEventListener('click', () => setMode('login'));
    registerTab.addEventListener('click', () => setMode('register'));

    form.addEventListener('submit', async event => {
      event.preventDefault();

      if (sending || !form.reportValidity()) return;

      const name = username.value.trim();
      const pass = password.value;

      if (mode === 'register' && pass !== confirmPassword.value) {
        showNotice('As senhas não coincidem.');
        confirmPassword.focus();
        return;
      }

      sending = true;
      submitButton.disabled = true;
      submitButton.textContent = mode === 'register'
        ? 'Criando conta...'
        : 'Entrando...';

      showNotice('', '');

      try {
        const endpoint = mode === 'register'
          ? '/api/register'
          : '/api/login';

        const data = await apiRequest(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: name,
            password: pass
          })
        });

        if (data.success === false || data.sucesso === false) {
          throw new Error(
            data.error ||
            data.message ||
            'Não foi possível concluir a operação.'
          );
        }

        showNotice('Operação concluída! Redirecionando...', 'success');

        location.assign(getDestination());
      } catch (error) {
        showNotice(error.message || 'Ocorreu um erro.');
        sending = false;
        submitButton.disabled = false;
        submitButton.textContent = mode === 'register'
          ? 'Criar minha conta'
          : 'Entrar na conta';
      }
    });

    setMode('login');
    checkSession();
  })();
  </script>
</body>
</html>
