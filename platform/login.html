


<script>
(() => {
  'use strict';

  const API_URL = 'https://dfdfdf-1.onrender.com';

  function iniciarLogin() {
    const $ = id => document.getElementById(id);

    const form = $('authForm');
    const loginTab = $('loginTab');
    const registerTab = $('registerTab');
    const confirmWrap = $('confirmWrap');
    const confirmPassword = $('confirmPassword');
    const password = $('password');
    const submitButton = $('submitButton');
    const notice = $('notice');
    const username = $('username');
    const heading = $('heading');
    const description = $('description');

    // Não inicia se o HTML necessário não existir.
    const elementos = {
      authForm: form,
      loginTab,
      registerTab,
      confirmWrap,
      confirmPassword,
      password,
      submitButton,
      notice,
      username,
      heading,
      description
    };

    const ausentes = Object.keys(elementos).filter(
      id => !elementos[id]
    );

    if (ausentes.length) {
      console.error(
        '[BlockWorld] HTML incompleto. Elementos ausentes:',
        ausentes.join(', ')
      );

      console.error(
        '[BlockWorld] Confira se este script está no login.html correto.'
      );
      return;
    }

    let modo = 'login';
    let enviando = false;

    function mostrarAviso(mensagem, tipo = 'error') {
      notice.textContent = mensagem;
      notice.className = 'notice ' + tipo;
    }

    function definirModo(novoModo) {
      if (enviando) return;

      modo = novoModo === 'register' ? 'register' : 'login';

      const cadastro = modo === 'register';

      loginTab.classList.toggle('active', !cadastro);
      registerTab.classList.toggle('active', cadastro);

      confirmWrap.hidden = !cadastro;
      confirmPassword.required = cadastro;

      password.autocomplete = cadastro
        ? 'new-password'
        : 'current-password';

      heading.textContent = cadastro
        ? 'Crie sua conta'
        : 'Bem-vindo de volta!';

      description.textContent = cadastro
        ? 'Cadastre-se para começar sua jornada na BlockWorld.'
        : 'Entre para acessar sua conta e seus jogos.';

      submitButton.textContent = cadastro
        ? 'Criar minha conta'
        : 'Entrar na conta';

      notice.textContent = '';
      notice.className = 'notice';
    }

    function destino() {
      const params = new URLSearchParams(location.search);
      const proximo = params.get('next') || '/';

      if (
        proximo.startsWith('/') &&
        !proximo.startsWith('//') &&
        !proximo.startsWith('/\\') &&
        proximo !== '/login.html'
      ) {
        return proximo;
      }

      return '/';
    }

    async function requisicaoAPI(caminho, opcoes = {}) {
      let resposta;

      try {
        resposta = await fetch(API_URL + caminho, {
          ...opcoes,
          credentials: 'include',
          cache: 'no-store'
        });
      } catch (erro) {
        console.error('[BlockWorld] Falha na API:', erro);

        throw new Error(
          'Não foi possível conectar ao servidor. Verifique a conexão e o CORS.'
        );
      }

      const tipo = resposta.headers.get('content-type') || '';
      let dados = {};

      if (tipo.includes('application/json')) {
        try {
          dados = await resposta.json();
        } catch {
          throw new Error('O servidor retornou uma resposta JSON inválida.');
        }
      } else {
        throw new Error(
          'Resposta inesperada do servidor. Código HTTP ' +
          resposta.status + '.'
        );
      }

      if (!resposta.ok) {
        throw new Error(
          dados.error ||
          dados.message ||
          'Erro HTTP ' + resposta.status + '.'
        );
      }

      return dados;
    }

    async function verificarSessao() {
      try {
        const dados = await requisicaoAPI('/api/me');

        if (dados.user) {
          mostrarAviso(
            'Você já está conectado como ' +
            dados.user.username +
            '. Redirecionando...',
            'success'
          );

          submitButton.disabled = true;

          window.setTimeout(() => {
            location.replace(destino());
          }, 500);
        }
      } catch (erro) {
        // Uma sessão inexistente não impede o usuário de entrar.
        console.warn(
          '[BlockWorld] Verificação da sessão:',
          erro.message
        );
      }
    }

    loginTab.addEventListener('click', () => {
      definirModo('login');
    });

    registerTab.addEventListener('click', () => {
      definirModo('register');
    });

    form.addEventListener('submit', async evento => {
      evento.preventDefault();

      if (enviando) return;

      if (!form.reportValidity()) return;

      const nome = username.value.trim();
      const senha = password.value;

      if (modo === 'register' && senha !== confirmPassword.value) {
        mostrarAviso('As senhas não coincidem.');
        return;
      }

      enviando = true;
      submitButton.disabled = true;

      submitButton.textContent = modo === 'register'
        ? 'Criando conta...'
        : 'Entrando...';

      notice.textContent = '';
      notice.className = 'notice';

      try {
        const caminho = modo === 'register'
          ? '/api/register'
          : '/api/login';

        const dados = await requisicaoAPI(caminho, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: nome,
            password: senha
          })
        });

        if (dados.success === false || dados.sucesso === false) {
          throw new Error(
            dados.error ||
            dados.message ||
            'Não foi possível concluir a operação.'
          );
        }

        mostrarAviso(
          'Tudo certo! Entrando na BlockWorld...',
          'success'
        );

        // Evita reativar o botão durante o redirecionamento.
        location.assign(destino());
        return;

      } catch (erro) {
        mostrarAviso(
          erro.message || 'Falha ao entrar na conta.'
        );
      }

      enviando = false;
      submitButton.disabled = false;

      submitButton.textContent = modo === 'register'
        ? 'Criar minha conta'
        : 'Entrar na conta';
    });

    definirModo('login');
    verificarSessao();
  }

  // Aguarda o HTML ser carregado antes de procurar os elementos.
  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      iniciarLogin,
      { once: true }
    );
  } else {
    iniciarLogin();
  }
})();
</script>
